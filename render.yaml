# Deploiement Render.
# complianceai-api tourne sur une instance Standard (1 CPU / 2 Go de RAM,
# passee le 2026-09-06) : assez de RAM pour charger fastembed en plus du
# reste du processus, donc EMBEDDING_BACKEND=fastembed ci-dessous plutot que
# le repli par hachage lexical (voir app/services/embeddings.py). Apres tout
# changement de backend d'embeddings, rejouer l'ingestion des referentiels :
# le referentiel et les documents client doivent partager le meme espace
# vectoriel.
#
# complianceai-db est passee du plan free au plan payant basic-256mb le
# 2026-09-13, suite a une premiere expiration en conditions reelles : le
# plan free Render expire 30 jours apres sa creation, coupant l'acces a la
# base (verrouillee, pas supprimee dans notre cas — recuperee en upgradant
# depuis le tableau de bord Render, sans perte de donnees). Le plan payant
# supprime ce risque de coupure recurrente.
#
# Stockage toujours ephemere (pas encore de disque persistant Render ni de
# stockage objet externe) : STORAGE_DIR (pieces versees, rapports, repli
# local des e-mails) vit sur le disque du conteneur et disparait a chaque
# redeploiement/redemarrage. Suffisant pour une demonstration, pas pour une
# mise en production reelle.
#
# E-mail transactionnel via Brevo (API HTTP), pas SMTP : constate en
# conditions reelles, Render bloque les ports sortants 25/465/587 sur son
# plan gratuit, quels que soient les identifiants — seul du trafic HTTPS
# (443) sort. BREVO_API_KEY reste `sync: false` : jamais dans le depot,
# saisi a la main dans le tableau de bord Render.
services:
  - type: web
    name: complianceai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: standard
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: complianceai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://complianceai-web.onrender.com"]'
      # Sert a construire les liens absolus dans les e-mails (verification,
      # reinitialisation) : sans elle, ces liens pointeraient vers
      # localhost, invalides pour quiconque hors de la machine de dev.
      - key: FRONTEND_URL
        value: https://complianceai-web.onrender.com
      - key: EMBEDDING_BACKEND
        value: fastembed
      - key: EMAIL_FROM
        value: sarahbelmiloud2001@gmail.com
      - key: BREVO_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # "Se connecter avec Google" (voir app/core/security.py et
      # app/api/v1/auth.py::google_login/google_register). Pas un secret a
      # proprement parler (le meme identifiant est aussi embarque cote
      # frontend, voir frontend/index.html::GOOGLE_CLIENT_ID) mais propre a
      # ce depot Google Cloud, donc saisi a la main plutot que versionne.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Veille reglementaire (voir app/services/scheduler.py) : reingestion
      # periodique (repli sans risque si le texte source est inchange, voir
      # ingestion/runner.py::ingest ligne ~93) qui notifie les organisations
      # concernees quand un referentiel change reellement. Poll toutes les
      # 5 min, verification par referentiel au plus une fois par 24h.
      - key: SCHEDULER_ENABLED
        value: "true"

  # Site statique : sert frontend/index.html tel quel, sans etape de build
  # (le frontend n'en a jamais eu besoin, voir frontend/README.md).
  - type: web
    name: complianceai-web
    runtime: static
    staticPublishPath: frontend
    buildCommand: "true"

databases:
  - name: complianceai-db
    plan: basic-256mb
    postgresMajorVersion: "16"

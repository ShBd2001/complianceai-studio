# Deploiement Render (offre gratuite).
# Attention : le service se met en veille apres 15 min d'inactivite ; la
# premiere requete suivante prend ~1 min le temps du reveil. Un cron de
# "keep-awake" reglerait ca, mais Render facture tout service cron au moins
# 1 $/mois, meme le plus simple : incompatible avec une offre 100% gratuite,
# donc volontairement absent d'ici. A ajouter a la main avant une
# demonstration si l'attente au reveil pose probleme.
#
# Stockage ephemere (plan free) : STORAGE_DIR (pieces versees, rapports,
# repli local des e-mails) vit sur le disque du conteneur et disparait a
# chaque redeploiement/redemarrage. Suffisant pour une demonstration, pas
# pour une mise en production reelle — la solution correcte serait un disque
# persistant Render (plan payant) ou un stockage objet externe (S3-compatible).
#
# La base Postgres gratuite expire 30 jours apres sa creation (limite du
# plan free Render) : a recreer / re-ingerer passe ce delai.
#
# SMTP non configure ci-dessous : les e-mails (verification, reinitialisation)
# repliront silencieusement sur un fichier local ecrit dans le conteneur, donc
# invisible et perdu au redemarrage. Ajouter SMTP_HOST/SMTP_USER/SMTP_PASSWORD
# (via `sync: false`, saisis manuellement dans le tableau de bord Render)
# avant toute utilisation reelle au-dela d'une demonstration.
#
# EMBEDDING_BACKEND=hashing : le plan free (512 Mo de RAM) ne suffit pas a
# charger le modele fastembed en plus du reste du processus — verifie en
# conditions reelles, le conteneur est tue par manque de memoire des le
# premier audit et Render le redemarre en boucle. Le repli par hachage n'a
# aucune qualite semantique (voir app/services/embeddings.py) : c'est un
# compromis assume pour rester sur l'offre gratuite, pas la configuration
# recommandee. Sur un plan avec plus de RAM, retirer cette ligne pour
# revenir a la vraie recherche semantique — et rejouer l'ingestion des
# referentiels ensuite, les deux cotes doivent utiliser le meme espace
# vectoriel.
services:
  - type: web
    name: complianceai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: complianceai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://complianceai-web.onrender.com"]'
      # Sert a construire les liens absolus dans les e-mails (verification,
      # reinitialisation) : sans elle, ces liens pointeraient vers
      # localhost, invalides pour quiconque hors de la machine de dev.
      - key: FRONTEND_URL
        value: https://complianceai-web.onrender.com
      - key: EMBEDDING_BACKEND
        value: hashing
      - key: GROQ_API_KEY
        sync: false

  # Site statique : sert frontend/index.html tel quel, sans etape de build
  # (le frontend n'en a jamais eu besoin, voir frontend/README.md).
  - type: web
    name: complianceai-web
    runtime: static
    staticPublishPath: frontend
    buildCommand: "true"

databases:
  - name: complianceai-db
    plan: free
    postgresMajorVersion: "16"

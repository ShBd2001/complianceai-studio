name: Anti-veille backend

# Cree a l'origine pour le plan gratuit Render, qui met le service en veille
# apres 15 min d'inactivite (la requete suivante attend alors ~30-60s le
# reveil du conteneur). complianceai-api tourne desormais sur le plan
# Standard (voir render.yaml), qui ne s'endort pas : ce ping n'est plus une
# necessite anti-veille, mais reste utile comme controle d'activite externe
# minimal (une alerte apparait dans l'onglet Actions si /health cesse de
# repondre 200). Depot public : ce cron ne consomme aucun quota Actions
# payant.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Reveiller / maintenir eveille complianceai-api
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://complianceai-api-l51c.onrender.com/health)
          echo "Reponse /health : $code"
          if [ "$code" != "200" ]; then
            echo "::warning::/health a repondu $code au lieu de 200"
          fi

name: Validation

on: [push, pull_request]

jobs:
  garde-fous:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Aucun appel API : tourne sur chaque commit, sans quota.
      - name: Garde-fous de sûreté
        run: python -m validation.test_garde_fous
      - name: Chaîne complète (client factice)
        run: |
          python -m validation.run_validation \
            --corpus corpus_demo \
            --verite corpus_demo/verite_terrain.json \
            --hors-ligne

  qualite-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Installer ruff et pip-audit
        run: pip install ruff pip-audit
      - name: Lint (ruff) — bloquant
        # E9 (erreurs de syntaxe) + F (pyflakes : imports/variables inutilises,
        # noms non definis). B008 (appel de fonction en argument par defaut)
        # est le pattern FastAPI standard (Depends/Query/Path), pas un bug —
        # jamais selectionne ici.
        run: ruff check . --select E9,F
      - name: Audit des dependances (pip-audit) — rapport, non bloquant
        # 150 CVE relevees sur 6 paquets lors de l'introduction de cette
        # etape (2026-09-20) : pyjwt et python-multipart corriges dans la
        # foulee, pypdf/pillow/starlette necessitent une montee de version
        # majeure planifiee separement (voir docs/architecture.md §6). Ne
        # bloque pas la CI tant que cette dette n'est pas soldee : un audit
        # rouge en permanence serait ignore, pas corrige.
        run: pip-audit -r requirements.txt || true

  backend-tests:
    runs-on: ubuntu-latest
    # Sans limite explicite, le defaut GitHub est 360 min : un runner qui
    # se bloque (constate en conditions reelles sur "playwright install",
    # bloque plusieurs heures sans echouer ni progresser) resterait visible
    # comme "en cours" indefiniment au lieu d'echouer et de liberer la file.
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
          POSTGRES_DB: complianceai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance -d complianceai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base dediee au run : le suffixe _test evite tout risque de toucher
      # une base de developpement si ces variables fuitaient ailleurs.
      DATABASE_URL: postgresql+psycopg://compliance:compliance@localhost:5432/complianceai_test
      # Uniquement valable pour ce run CI ephemere, jamais une vraie base.
      JWT_SECRET: ci-only-secret-never-used-outside-github-actions-runners
      # Sans ça, httpx (base_url http://testserver, pas "localhost") laisse
      # tomber silencieusement le cookie Secure lors de la rotation refresh.
      COOKIE_SECURE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Installer Chromium (génération PDF sous test)
        run: playwright install --with-deps chromium
      - name: Suite de tests backend
        # tests/conftest.py migre la base _test et force LLM_ENABLED=false —
        # aucun quota Groq consomme, aucun reseau externe requis.
        run: pytest -q

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
          POSTGRES_DB: complianceai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance -d complianceai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Installer les dépendances (backend + Playwright)
        run: |
          pip install -r backend/requirements.txt
          pip install -r frontend/tests/requirements.txt
      - name: Installer Chromium (le backend l'utilise pour générer les PDF)
        run: playwright install --with-deps chromium
      - name: Suite bout-en-bout (Chrome du système pour le navigateur piloté, Chromium ci-dessus pour la génération PDF côté backend)
        # Demarre le vrai backend et le vrai serveur statique du frontend en
        # sous-processus (voir frontend/tests/conftest.py) : pas de mock DOM.
        run: pytest -q frontend/tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: captures-e2e
          path: frontend/tests/failures/

  non-regression:
    runs-on: ubuntu-latest
    # 3 repetitions x 15 documents x ~15 articles, avec reessais sur erreur
    # Groq transitoire : constate en conditions reelles a plus de 20 min
    # (job annule avant conclusion, --repetitions 3, 2026-09-20).
    timeout-minutes: 40
    # Consomme du quota Groq : réservé à la branche principale.
    if: github.ref == 'refs/heads/main'
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install groq
      - name: Avertir si GROQ_API_KEY est absent
        if: env.GROQ_API_KEY == ''
        run: echo "::warning::GROQ_API_KEY n'est pas configuré (Settings > Secrets and variables > Actions) — validation non-régression ignorée."
      - name: Validation avec seuils bloquants
        if: env.GROQ_API_KEY != ''
        run: |
          python -m validation.run_validation \
            --corpus ./corpus \
            --verite corpus/verite_terrain.json \
            --repetitions 3 \
            --ci
      - uses: actions/upload-artifact@v4
        if: always() && env.GROQ_API_KEY != ''
        with:
          name: rapport-validation
          path: rapport_validation.json
